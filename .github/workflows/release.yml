name: Release

# Publishes every package to nuget.org when a version tag (e.g. v1.2.0 or v1.3.0-beta.1) is pushed.
# Branch pushes never run this workflow. MinVer derives the package version from the tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write # to attach the packages to a GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tag and history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      - name: Check package versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls artifacts
          for pkg in artifacts/*.nupkg; do
            case "$pkg" in
              artifacts/Jorrk.*".$version.nupkg") ;;
              *) echo "::error::$pkg must be a Jorrk.* package carrying version $version"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts

      # Pushing a .nupkg also pushes the matching .snupkg (symbols) from the same folder.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::The NUGET_API_KEY repository secret is not set."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease
